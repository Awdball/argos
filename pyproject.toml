[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argos"
version = "0.2.0"
description = "Universal second-hand & first-hand deal-hunting intelligence framework with Hermes + Telegram integration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-telegram-bot>=21.0",
    "ddgs>=7.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "playwright>=1.48.0",
    "patchright>=1.49.0",
    "curl-cffi>=0.7.0",
    "camoufox>=0.4.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
argos = "argos.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argos = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
